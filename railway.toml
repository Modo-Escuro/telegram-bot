# Configuração do worker; variáveis e segredos ficam no painel Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m telegram_bot"
numReplicas = 1
sleepApplication = false
requiredMountPath = "/data"
overlapSeconds = 0
drainingSeconds = 0
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
