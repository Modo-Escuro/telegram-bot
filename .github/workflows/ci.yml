name: Verificações
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag compra-contexto-telegram:ci .
      - run: docker run --rm --network none compra-contexto-telegram:ci python -m pip check
      - run: docker run --rm --network none compra-contexto-telegram:ci python -m telegram_bot --help
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
  integration-run01:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Modo-Escuro/api-backend
          ref: dc448f9e117e05192004514a639c3ed5acd1098a
          path: .integration-api
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci --ignore-scripts
        working-directory: .integration-api
      - run: python -m unittest discover -s tests -p test_run01_integration.py -v
        env:
          BOT01_API_ROOT: .integration-api
