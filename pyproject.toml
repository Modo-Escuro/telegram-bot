[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compra-contexto-telegram"
version = "0.1.0"
description = "Interface Telegram do Compra com Contexto"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
telegram-bot = "telegram_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_bot = ["contracts/v1/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
