[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compra-contexto-telegram"
version = "0.1.0"
description = "Interface Telegram do Compra com Contexto"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
telegram-bot = "telegram_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
